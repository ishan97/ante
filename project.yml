name: Ante
options:
  bundleIdPrefix: ante
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AnteCore:
    path: Packages/AnteCore
  AnteTerm:
    path: Packages/AnteTerm
  AnteTheme:
    path: Packages/AnteTheme
  AnteUI:
    path: Packages/AnteUI
  AntePanel:
    path: Packages/AntePanel
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES

targets:
  Ante:
    type: application
    platform: macOS
    sources:
      - path: Ante
    dependencies:
      - package: AnteCore
      - package: AnteTerm
      - package: AnteTheme
      - package: AnteUI
      - package: AntePanel
      - package: Sparkle
        product: Sparkle
    info:
      path: Ante/Info.plist
      properties:
        CFBundleName: Ante
        CFBundleDisplayName: Ante
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "146"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Ishan Gupta. MIT License."
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://raw.githubusercontent.com/ishan97/ante/main/appcast.xml
        SUPublicEDKey: "AJUWz+vIaswF5A/cKxLJTHeayb3cMiSSS5pcbVE3gug="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Ante/Ante.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ante.term
        PRODUCT_NAME: Ante
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
